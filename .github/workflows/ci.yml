name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Guard against non-GET calls in the read-only provider clients
        run: |
          # Every provider client is read-only in effect. Each has exactly one
          # legitimate exception -- a read-only query submitted via POST,
          # which HTTP requires for a request body (GitHub GraphQL, Azure
          # DevOps WIQL). Anything else matching a non-GET method string
          # fails the build. The glob picks up a new client without anyone
          # having to remember to list it.
          shopt -s nullglob
          files=(lib/sources/*-client.ts)
          # A moved or renamed file would make the glob match nothing and the
          # guard pass quietly.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::read-only guard: no lib/sources/*-client.ts files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            matches=$(grep -nE "method:\s*['\"](POST|PUT|PATCH|DELETE)['\"]" "$file" | grep -v "READ-ONLY-QUERY" || true)
            if [ -n "$matches" ]; then
              echo "::error file=$file::Non-GET method string found outside an explicitly marked read-only query:"
              echo "$matches"
              exit 1
            fi
          done
